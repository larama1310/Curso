<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 1) flex -->
    <div class="flex">
        <p>Meu</p>
        <p>Primeiro</p>
        <p>Elemento</p>
        <p>Com flex</p>
    </div>
    <!-- 2) column -->
    
    <div class="flex-column">
      <span>1</span>
      <span>2</span>
      <span>3</span>
    </div>

    <!-- 3) flex wrap -->
     <div class="wrap">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        
     </div>

     <!-- 4) justify-content (horizontal)-->
      <h2>Center</h2>
      <div class="center">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
      </div>
    <!-- existe o center, mas tbm o space-around, o space-between e o end -->

      <!-- 5) align items (vertical)-->
       <h2> AlignCenter</h2>
      <div class="align-center">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
      </div>
    <!-- há tbm o strech e o end -->

      <!-- 6) gap -->
       <div class="gap">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
       </div>

       <!-- 7) order -->
        <h2>Order</h2>
        <div class="order">
            <div class="box" id="three">3</div>
            <div class="box" id="one">1</div>
            <div class="box" id="two">2</div>
        </div>

        <!-- 8) Grow -->
         <h2>Grow</h2>
         <div class="grow">
            <div class="box"></div>
            <div class="boxbig"></div>
            <div class="box"></div>
         </div>

         <!-- 9) Basis -->
    <h2>Basis</h2>
     <div class="basis">
            <div class="box"></div>
            <div class="boxbig"></div>
            <div class="box"></div>
    </div>
         <!-- observe oq acontece -->

         <!-- 10) shrink -->
           <h2>Shrink</h2>
         <div class="shrink">
            <div class="box"></div>
            <div class="boxsmall"></div>
            <div class="box"></div>
         </div>
         <!-- elemento que encolhe conforme a tela é reduzida -->
</body>
</html>
